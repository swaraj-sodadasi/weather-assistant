name: Deploy Weather Assistant Web App & Documentation

on:
  push:
    branches:
      - main
      - master # Triggers execution instantly whenever you push code changes to main/master branch

permissions:
  contents: read
  pages: write      # Grants permission to safely publish files to GitHub Pages
  id-token: write   # Required for secure authentication with the hosting server

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install Doxygen Build Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Run Doxygen Compiler
        run: |
          # Compiles Doxygen documentation into docs/html
          (cat docs/Doxyfile; echo "OUTPUT_DIRECTORY = ."; echo "HTML_OUTPUT = docs/html") | doxygen -

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v4

      - name: Upload Web App & Doxygen Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Serves root index.html as the main website homepage
          path: '.'

      - name: Deploy to GitHub Pages Live
        id: deployment
        uses: actions/deploy-pages@v4
