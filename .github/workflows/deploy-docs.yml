name: Deploy Weather Assistant App & Docs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install Doxygen Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build Doxygen Documentation
        run: |
          doxygen Doxyfile || true

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Weather Web App & Doxygen Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Serves index.html at root (https://swaraj-sodadasi.github.io/weather-assistant/)
          path: '.'

      - name: Deploy to GitHub Pages Live
        id: deployment
        uses: actions/deploy-pages@v4