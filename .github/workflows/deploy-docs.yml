name: Deploy Live Documentation & Application

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Doxygen & Graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install NPM Virtual Environment Dependencies
        run: npm ci || npm install

      - name: Generate Doxygen Live Documentation
        run: npm run docs

      - name: Prepare GitHub Pages Deployment Artifact
        run: |
          mkdir -p _site
          # Copy Web Application shell & assets to root of Pages deployment
          cp index.html index.css weather-information.js map-information.js speech-tasks.js LICENSE _site/
          
          # Copy Doxygen HTML output to /docs route for live documentation access
          mkdir -p _site/docs
          cp -r docs/html/* _site/docs/
          
          # Prevent Jekyll processing on GitHub Pages
          touch _site/.nojekyll

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
