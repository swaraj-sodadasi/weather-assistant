name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install Doxygen Build Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Run Doxygen Compiler
        run: |
          doxygen Doxyfile

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v4

      - name: Upload Generated HTML Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages Live
        id: deployment
        uses: actions/deploy-pages@v4